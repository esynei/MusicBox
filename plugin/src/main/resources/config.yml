# Show information about instruments added in Minecraft 1.14
printNewInstrument: true

# Send anonymous usage statistics to bStats
# Disabled by default. Set to true to opt-in
bStatsOptIn: false

economy:
  # Enable the disc shop available in /musicbox shop
  enable: true
  # Price of each disc in the shop
  price: 500

# Maximum distance at which speaker-mode music can be heard
speakerRadius: 10

# Configure music playback bossbar
bossbar:
  enable: true
  color: GREEN
  style: SEGMENTED_20

# Plugin language. Available values: en, ru
lang: en

# Maximum distance at which jukebox music can be heard
jukeboxRadius: 64

# Stop playback when nobody has been within hearing range for this many seconds
# Applies to speakers, signs, and jukeboxes. Set to 0 to disable
autoDestroy: 60

# Require the musicbox.hear permission to hear audio
# When false, everyone can hear the music
hearPermissionsCheck: false

# Enable notes outside Minecraft's standard two-octave range
# A compatible resourcepack is required. When false, notes are transposed into the standard range
enable10octave: false